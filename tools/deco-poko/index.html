<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デコポコ</title>
<style>
  :root {
    --panel: rgba(28, 22, 34, 0.92);
    --panel-edge: rgba(255, 255, 255, 0.08);
    --ink: #f3eef7;
    --ink-dim: #a99bb5;
    --accent: #ff7fb3;
    --accent-soft: rgba(255, 127, 179, 0.18);
    --radius: 14px;
    --font: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    font-family: var(--font);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #view {
    position: fixed; inset: 0; display: block;
    cursor: none;
  }
  #cursor {
    position: fixed; left: 0; top: 0; width: 20px; height: 20px;
    border: 1.5px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.6);
    pointer-events: none; transform: translate(-50%, -50%);
    display: none;
  }
  #ui.hidden { display: none; }
  /* OBS の外で開いた時だけ、透過部分が分かるように市松模様を出す(?bg=transparent で消せる) */
  body.preview { background: repeating-conic-gradient(#8a8a8a 0 25%, #a8a8a8 0 50%) 0 0 / 24px 24px; }

  /* floating button */
  #fab {
    position: fixed; width: 46px; height: 46px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--panel-edge);
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    display: grid; place-items: center; cursor: grab; z-index: 10;
    color: var(--ink);
  }
  #fab:active { cursor: grabbing; }
  #fab .dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff;
    transition: transform .15s;
  }
  #fab.open .dot { transform: scale(.6); }

  /* panel */
  #panel {
    position: fixed; width: 250px; padding: 12px; z-index: 9;
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: var(--radius); color: var(--ink);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    backdrop-filter: blur(8px);
    font-size: 12px; line-height: 1.4;
    max-height: calc(100vh - 8px); overflow-y: auto; /* 小さいウィンドウでも下の欄まで届くように */
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent;
  }
  #panel.closed { display: none; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .row label { color: var(--ink-dim); min-width: 46px; }
  .seg { display: flex; gap: 4px; flex: 1; }
  .seg button, .btn {
    flex: 1; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--panel-edge);
    background: rgba(255,255,255,.04); color: var(--ink); font: inherit; cursor: pointer;
  }
  .seg button.on { background: var(--accent-soft); border-color: var(--accent); }
  #tools { flex-wrap: wrap; }
  #tools button { flex: 1 0 28%; }
  .edot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 3px; vertical-align: middle;
    box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
  /* 画面に出る小パレット(右クリック / 長押し) */
  #qp { position: fixed; z-index: 30; width: 252px; padding: 8px; border-radius: 12px; background: var(--panel);
    border: 1px solid var(--panel-edge); box-shadow: 0 8px 24px rgba(0,0,0,.45); color: var(--ink); font-size: 12px; }
  #qp .qtools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-bottom: 6px; }
  #qp .qtools button { padding: 5px 0; white-space: nowrap; letter-spacing: -.02em; border-radius: 7px; border: 1px solid var(--panel-edge); background: rgba(255,255,255,.04);
    color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; }
  #qp .qtools button.on { background: var(--accent-soft); border-color: var(--accent); }
  #qp .qsw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  #qp .qsw div { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); cursor: pointer; }
  #qp .qsw div.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* フチを付けられない道具(ネオン・水彩・消しゴム)を選んでいる間はフチの欄を薄くする */
  #panel.noedge .edgeRow { opacity: .35; pointer-events: none; }
  #panel:not(.eraser) #emodeRow { display: none; }
  #cursor.obj { border-style: dashed; }
  #qp .qmode { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; margin: -2px 0 6px; }
  #qp .qmode button { padding: 4px 0; border-radius: 7px; border: 1px solid var(--panel-edge); background: rgba(255,255,255,.04);
    color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; }
  #qp .qmode button.on { background: var(--accent-soft); border-color: var(--accent); }
  .btn:hover, .seg button:hover { background: rgba(255,255,255,.1); }
  .btn:disabled { opacity: .35; cursor: default; }
  input[type=range] { flex: 1; accent-color: var(--accent); margin: 0; }
  .val { width: 30px; text-align: right; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .wellCol { display: flex; flex-direction: column; gap: 4px; flex: none; }
  .dropper { width: 30px; height: 22px; padding: 0; border-radius: 6px; border: 1px solid var(--panel-edge);
    background: rgba(255,255,255,.04); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .dropper.on { background: var(--accent-soft); border-color: var(--accent); }
  body.picking #view { cursor: crosshair; }
  body.picking #cursor { display: none !important; }
  #qp .qsw .qdrop { display: grid; place-items: center; color: var(--ink); background: rgba(255,255,255,.08); }
  .well {
    width: 30px; height: 26px; padding: 0; border: 1px solid var(--panel-edge);
    border-radius: 6px; cursor: pointer; flex: none;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.25);
  }
  .well.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* in-panel color picker (native <input type=color> の popup は OBS の対話ウィンドウで当てにならない) */
  #picker { margin: 0 0 8px; padding: 8px; border-radius: 10px; background: rgba(0,0,0,.25); }
  #picker.closed { display: none; }
  #picker .title { color: var(--ink-dim); margin-bottom: 6px; }
  #sv, #hue { display: block; width: 100%; border-radius: 6px; cursor: crosshair; touch-action: none; }
  #sv { height: 110px; margin-bottom: 6px; }
  #hue { height: 14px; margin-bottom: 8px; }
  #hex {
    flex: 1; min-width: 0; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--panel-edge);
    background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums;
    user-select: text; -webkit-user-select: text;
  }
  #hex.bad { border-color: #ff4d4d; }
  .swatches { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .sw {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5);
    cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.4);
  }
  .sw.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layers { display: flex; gap: 4px; flex: 1; }
  .layer {
    flex: 1; display: flex; align-items: center; gap: 4px; padding: 4px 6px;
    border-radius: 8px; border: 1px solid var(--panel-edge); cursor: pointer;
    background: rgba(255,255,255,.04);
  }
  .layer.on { background: var(--accent-soft); border-color: var(--accent); }
  .layer .eye {
    width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink-dim);
    flex: none;
  }
  .layer.visible .eye { background: var(--ink); border-color: var(--ink); }
  .hint { color: var(--ink-dim); font-size: 10px; text-align: center; margin-top: 4px; }
  .sep { height: 1px; background: var(--panel-edge); margin: 10px -12px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="cursor"></div>

<div id="qp" hidden></div>
<div id="ui">
  <div id="fab" title="ドラッグで移動 / クリックで開閉"><div class="dot"></div></div>
  <div id="panel" class="closed">
    <div class="row">
      <label>ツール</label>
      <div class="seg" id="tools">
        <button data-tool="brush" title="ふつうの線。フチ幅を上げるとフチが付く">ペン</button>
        <button data-tool="gloss" title="ぷっくりした線に、ところどころツヤ。フチ幅を上げるとフチが付く">艶</button>
        <button data-tool="marker" title="半透明。続けて描いても重なりが濃くならない。フチ幅を上げるとフチが付く">マーカー</button>
        <button data-tool="neon" title="線の色で光るペン">ネオン</button>
        <button data-tool="watercolor" title="筆で塗った水彩。重ねると濃くなる。フチ幅は選ぶたびに 0 に戻る">水彩</button>
        <button data-tool="eraser">消しゴム</button>
      </div>
    </div>
    <div class="row" id="emodeRow">
      <label>消し方</label>
      <div class="seg" id="emode">
        <button data-emode="pixel" title="なぞった所だけ消す">ピクセル</button>
        <button data-emode="object" title="触れた線を 1 本まるごと消す(選んでいるレイヤーの線だけ)">オブジェクト</button>
      </div>
    </div>
    <div class="row">
      <label>太さ</label>
      <input type="range" id="size" min="1" max="80" value="8">
      <span class="val" id="sizeVal">8</span>
    </div>
    <div class="row">
      <label>不透明</label>
      <input type="range" id="alpha" min="5" max="100" value="100">
      <span class="val" id="alphaVal">100</span>
    </div>
    <div class="row">
      <label>色</label>
      <div class="wellCol">
        <button class="well" id="colorWell" title="ペンの色を選ぶ"></button>
        <button class="dropper" id="dropper" title="スポイト(Chrome / Edge では画面のどこでも、それ以外ではボードを触った所の色を拾う)"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M19.4 4.6a2.6 2.6 0 0 0-3.7 0l-2.3 2.3-1-1-1.4 1.4 1 1-7.3 7.3V19h3.4l7.3-7.3 1 1 1.4-1.4-1-1 2.3-2.3a2.6 2.6 0 0 0 .3-3.4zM7.6 17H7v-.6l7-7 .6.6-7 7z"/></svg></button>
      </div>
      <div class="swatches" id="presets"></div>
    </div>
    <div class="row">
      <label>履歴</label>
      <div class="swatches" id="history" title="描いた色が入ります / 右クリックで削除"></div>
    </div>
    <div class="row edgeRow">
      <label>フチ色</label>
      <div class="seg" id="oedge" title="フチの色。自動はペンが明るいと黒、暗いと白">
        <button data-edge="auto">自動</button>
        <button data-edge="white">白</button>
        <button data-edge="black">黒</button>
        <button data-edge="custom" title="フチの色を自由に選ぶ">自由<span class="edot" id="ocolorDot"></span></button>
      </div>
    </div>
    <div class="row edgeRow">
      <label>フチ幅</label>
      <input type="range" id="osize" min="0" max="30" value="0" title="フチの太さ。0 はフチなし(ペン・艶・マーカーごとに覚える)">
      <span class="val" id="osizeVal">0</span>
    </div>
    <div id="picker" class="closed">
      <div class="title" id="pickerTitle">ペンの色</div>
      <canvas id="sv" width="226" height="110"></canvas>
      <canvas id="hue" width="226" height="14"></canvas>
      <div class="row">
        <input id="hex" maxlength="7" spellcheck="false" autocomplete="off">
        <button class="btn" id="pickerClose" style="flex:none;padding:6px 10px">閉じる</button>
      </div>
    </div>
    <div class="sep"></div>
    <div class="row">
      <label>レイヤー</label>
      <div class="layers" id="layers"></div>
    </div>
    <div class="row">
      <button class="btn" id="undo">戻す</button>
      <button class="btn" id="redo">やり直す</button>
      <button class="btn" id="clearLayer">このレイヤーを消す</button>
    </div>
    <div class="row">
      <button class="btn" id="clearAll">全部消す</button>
      <button class="btn" id="hideUi">UIを隠す (Tab)</button>
    </div>
    <div class="hint">Tab でUIを隠す/出す ・ 履歴は右クリックで削除 ・ v<span id="ver"></span></div>
  </div>
</div>

<script>
(() => {
  const VERSION = '1.3.0'; // tools/deco-poko/tool.json と揃える
  // OBS のローカルファイル指定は全ソースが同じ origin(localStorage 共有)になるので、
  // 複数置くときは ?id=xxx を付けて保存先を分ける
  const BOARD_ID = new URLSearchParams(location.search).get('id') || '';
  // 一緒にデコるの OBS 用 / 招待 URL の画面は、ブラウザ版(1 人で描く絵)と保存を分ける(同じブラウザで開いても絵を上書きしない)
  const PLUS_VIA = (location.pathname.match(/^\/tools\/plus\/(obs|guest)\//) || [])[1];
  const LS_KEY = 'poko-deco-poko-v1' + (PLUS_VIA ? ':' + PLUS_VIA : '') + (BOARD_ID ? ':' + BOARD_ID : '');
  const LAYER_COUNT = 3;
  const OPS_MAX = 100; // 戻せる回数。超えた古い操作は base に焼き込む
  const PRESETS = ['#ffffff', '#000000', '#ff7fb3', '#ff4d4d', '#ffcc33', '#5ad66b', '#4aa3ff', '#b57bff'];

  const view = document.getElementById('view');
  const vctx = view.getContext('2d');
  const cursorEl = document.getElementById('cursor');
  const ui = document.getElementById('ui');
  const fab = document.getElementById('fab');
  const panel = document.getElementById('panel');

  let W = 0, H = 0;   // 絵の大きさ(1 人のときはウィンドウ、一緒にデコる中は 1920x1080 の論理座標)
  let VW = 0, VH = 0; // ウィンドウ(表示)の大きさ
  let stage = null;   // 一緒にデコる中だけ {w: 1920, h: 1080}。collab.js が setStage で切り替える
  let vs = 1, vox = 0, voy = 0; // 絵 → 表示の拡大率とずらし

  // ---------- state ----------
  const state = {
    tool: 'brush',
    size: 8,
    alpha: 1,
    malpha: 0.4, // マーカーの濃さ(マーカーを選んでいる間の「不透明」スライダー)
    color: '#ff7fb3',
    oedge: 'auto', // 'auto' | 'white' | 'black' | 'custom'
    ocolor: '#ffffff', // oedge が custom のときのフチ色
    eo: { brush: 0, gloss: 0, marker: 0, watercolor: 0 }, // フチ幅(道具ごと)。0 はフチなし
    emode: 'pixel', // 消しゴムの消し方: pixel(なぞった所)/ object(触れた線を 1 本まるごと。iOS のオブジェクト消しゴム)
    active: 0,
    visible: [true, true, true],
    history: [],
    fab: null,
    uiHidden: false,
    panelOpen: false,
  };

  // 1 レイヤー = canvas 1 枚。縁取りは線 1 本ごとに「フチ+線」をまとめて上に重ねる
  // (フチだけ別の canvas に分けると、あとから描いた縁取りのフチが先に描いた線の下に回る)
  const layers = [];
  const makeCanvas = () => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, W); c.height = Math.max(1, H);
    return c;
  };
  // base = 戻せなくなった古い操作(と読み込んだ保存画像)を焼き込んだ画像。レイヤー = base + ops
  const base = [];
  for (let i = 0; i < LAYER_COUNT; i++) { layers.push(null); base.push(null); }
  // 縁取りが続く間はフチをまとめる(普通のペン・消しゴム・消去で区切る)。そのためにレイヤーごとに
  //   grp   = 今続いている縁取りの op(この間はフチを全部下に、線を全部上に描く)
  //   below = その縁取りが始まる前の画像(grp があるときだけ使う)
  // を持つ。L = 表示しているレイヤー、B = base(戻せない部分)。base をまたいで続く縁取りもつながる
  // kind = まとまりの種類(outline: フチをまとめる / marker: 重ねても濃くならない)
  const L = [], B = [];
  for (let i = 0; i < LAYER_COUNT; i++) { L.push({ grp: [], below: null, kind: null }); B.push({ grp: [], below: null, kind: null }); }

  let temp = null;    // 描いている途中の線(確定時にそのままレイヤーへ重ねる)
  let scratch = null; // 描き直しで線 1 本を組み立てる作業用
  let mk = null;      // マーカーのまとまりを不透明で描いてから 40% で重ねる作業用
  let gk = null, wk = null, hk = null; // 艶・水彩・フチ付きマーカーを組み立てる作業用(hk は艶のぼかした形)

  function resize(force) {
    VW = window.innerWidth; VH = window.innerHeight;
    if (view.width !== VW || view.height !== VH) { view.width = VW; view.height = VH; }
    const nw = stage ? stage.w : VW, nh = stage ? stage.h : VH;
    vs = stage ? Math.min(VW / nw, VH / nh) : 1;
    vox = stage ? (VW - nw * vs) / 2 : 0; voy = stage ? (VH - nh * vs) / 2 : 0;
    updateCursorSize();
    if (!force && nw === W && nh === H) { render(); return; }
    const ow = W, oh = H;
    W = nw; H = nh;
    const grow = (old) => {
      const c = makeCanvas();
      if (old && ow && oh) c.getContext('2d').drawImage(old, 0, 0);
      return c;
    };
    for (let i = 0; i < LAYER_COUNT; i++) {
      layers[i] = grow(layers[i]); base[i] = grow(base[i]);
      L[i].below = grow(L[i].below); B[i].below = grow(B[i].below);
    }
    temp = grow(null); scratch = grow(null); mk = grow(null); gk = grow(null); wk = grow(null); hk = grow(null);
    render();
  }

  // ---------- rendering ----------
  let raf = 0;
  function render() {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      vctx.setTransform(1, 0, 0, 1, 0, 0);
      vctx.clearRect(0, 0, VW, VH);
      vctx.setTransform(vs, 0, 0, vs, vox, voy);
      for (let i = 0; i < LAYER_COUNT; i++) {
        if (!state.visible[i]) continue;
        // 縁取りを続けて描いている途中は、まとまり全体を temp に描き直しているので、始まる前の画像の上に重ねる
        const cont = stroke && i === stroke.layer && groupKind(stroke) && L[i].grp.length && L[i].kind === groupKind(stroke);
        vctx.drawImage(cont ? L[i].below : layers[i], 0, 0);
        if (board.collab) board.collab.renderLayer(vctx, i); // 確定待ちの自分の線・相手の描きかけ
        if (stroke && i === stroke.layer && stroke.tool !== 'eraser') vctx.drawImage(temp, 0, 0);
      }
    });
  }

  // ---------- 操作ログ(戻す / やり直す) ----------
  // op = 線   {kind: 'stroke', id, layer, tool, color, alpha, size, ec(フチ色。確定時に決める), osize(フチ幅。0 はフチなし), pts: [{x, y}]}
  //    | 消去 {kind: 'clear', id, layer: 0..2 | 'all'}
  //    | 線ごと消す {kind: 'erase', id, layer, targets: [線の id]}(オブジェクト消しゴム。targets の線を描き直しで飛ばす。戻すと線が戻る)
  // レイヤーの画像 = base + そのレイヤーに関わる op を順に重ねたもの。戻すは最後の op を外して描き直す
  let ops = [], redoOps = [];
  let nextId = 1; // op の id(保存する。線ごと消すときの目印)
  const affects = (op, i) => op.layer === 'all' || op.layer === i;
  // 線ごと消された線の id(今ある erase op の targets)
  function erasedIds() {
    const s = new Set();
    for (const op of ops) if (op.kind === 'erase') for (const t of op.targets) s.add(t);
    return s;
  }
  // レイヤー i を描き直すときの op(線ごと消した線と erase op 自体は飛ばす。hide = なぞっている途中で消える予定の線)
  function layerOps(i, hide) {
    const gone = erasedIds();
    return ops.filter(op => affects(op, i) && op.kind !== 'erase' && !gone.has(op.id) && !(hide && hide.has(op.id)));
  }
  const opLayers = op => op.layer === 'all' ? [...Array(LAYER_COUNT).keys()] : [op.layer];

  // 線 1 本を ctx に重ねる。縁取りは scratch で「フチ+線」を組み立ててから重ねる(描いている途中の表示と同じ)
  function applyOp(ctx, op) {
    if (op.kind === 'break') return; // 縁取りのまとまりを区切るだけの印(一緒にデコるの「自分の線だけ消す」など)
    if (op.kind === 'clear') { ctx.clearRect(0, 0, W, H); return; }
    if (op.tool === 'eraser') { drawPath(ctx, op.pts, op.size, '#000', 1, 'destination-out'); return; }
    const r = strokeRadius(op);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of op.pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }

  // まとまりを描く。縁取り: フチを全部 → 線を全部。マーカー: 不透明で全部描いてから 40% で 1 回だけ重ねる
  function paintGroupTo(c, grp, kind) {

        for (const p of op.pts) { x0 = Math.min(x0, p.x - r); y0 = Math.min(y0, p.y - r); x1 = Math.max(x1, p.x + r); y1 = Math.max(y1, p.y + r); }

      x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));

        const e = wk.getContext('2d');

      for (const p of op.pts) { x0 = Math.min(x0, p.x - r); y0 = Math.min(y0, p.y - r); x1 = Math.max(x1, p.x + r); y1 = Math.max(y1, p.y + r); }

    x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));

  function appendOps(canvas, st, list) {

      const b = st.below.getContext('2d');
      if (!st.grp.length) { b.clearRect(0, 0, W, H); b.drawImage(canvas, 0, 0); st.kind = runKind; } // まとまりの始まり
      st.grp.push(...run); run = [];

      drawGroup(ctx, st.grp, st.kind);

    for (const op of list) {
      const k = groupKind(op);

        let gone = false;

        c.drawImage(img, 0, 0);
        res();

      img.onerror = () => res();
      img.src = url;
    });

  const q1 = v => board.collab ? Math.round(v * 10) / 10 : v;
  const toBoard = ev => ({ x: q1((ev.clientX - vox) / vs), y: q1((ev.clientY - voy) / vs) });

  const LONG_PRESS_MS = 500, MOVE_SLOP = 8;

    render();

  // 描けない状態(非表示のレイヤー・一緒にデコるのつなぎ直し中)でも、指の長押しで小パレットは出す
  let pressOnly = null;

    clearTimeout(pressTimer);

  }

  // ---------- オブジェクト消しゴム(触れた線を 1 本まるごと消す。選んでいるレイヤーの線だけ)----------
  // なぞっている間は当たった線を描き直しで隠し、離したら erase op 1 つとして確定する(戻す 1 回で全部戻る)。
  // 消せるのは線として残っている op だけ(直近 100 本。それより古い線と 1.1 以前の保存の絵は画像なので消せない)。

      for (const q of op.pts) { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }

    if (p.x < x0 - r || p.x > x1 + r || p.y < y0 - r || p.y > y1 + r) return false;
    if (op.pts.length === 1) return Math.hypot(p.x - op.pts[0].x, p.y - op.pts[0].y) <= r;

  // 1 人のとき: レイヤーに見えている線(後ろの消去より後で、線ごと消されていない。消しゴムの線は除く)

      let pend = temp;

  function moveCursor(e) {

    panel.classList.toggle('noedge', !EDGE_TOOLS.includes(t));
    panel.classList.toggle('eraser', t === 'eraser');
    cursorEl.classList.toggle('obj', t === 'eraser' && state.emode === 'object');
    const o = EDGE_TOOLS.includes(t) ? state.eo[t] || 0 : 0;

  $('alpha').addEventListener('input', () => {

  // ---------- colors ----------
  const isHex = c => typeof c === 'string' && /^#[0-9a-f]{6}$/.test(c);
  const hexToRgb = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const rgbToHex = rgb => '#' + rgb.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');

  const near = (a, b) => {
    const p = hexToRgb(a), q = hexToRgb(b);

  };
  function hsvToHex(h, s, v) {
    const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };

    if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return { h: (h * 60 + 360) % 360, s: max ? d / max : 0, v: max };
  }

  function setColor(c) {
    state.color = c;
    refreshSwatches(); save();
  }
  // 自動: ペンが明るければ黒、暗ければ白(白ペン+白フチで太い白線になるのを防ぐ)
  function edgeColor() {
    if (state.oedge === 'custom') return state.ocolor;
    if (state.oedge === 'white') return '#ffffff';
    if (state.oedge === 'black') return '#000000';
    // 相対輝度(sRGB を線形に戻して計算)。ピンク #ff7fb3 は白フチ、黄 #ffcc33 は黒フチ
    const [r, g, b] = hexToRgb(state.color).map(v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });

  const oedgeEl = $('oedge');
  oedgeEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;

  });
  function setEdge(v) {
    state.oedge = v;
    for (const b of oedgeEl.children) b.classList.toggle('on', b.dataset.edge === v);
    $('ocolorDot').style.background = state.ocolor;
    save();
  }
  function setOcolor(c) {
    state.ocolor = c;
    $('ocolorDot').style.background = c;
    save();
  }

  function swatch(color, parent, removable) {
    const d = document.createElement('div');
    d.className = 'sw'; d.style.background = color; d.dataset.color = color;
    d.addEventListener('click', () => { setColor(color); syncPicker(); });
    if (removable) d.addEventListener('contextmenu', e => {
      e.preventDefault();
      state.history = state.history.filter(x => x !== color);
      refreshSwatches(); save();
    });
    parent.appendChild(d);
  }
  function refreshSwatches() {
    const p = $('presets'), h = $('history');
    p.innerHTML = ''; h.innerHTML = '';

    state.history.forEach(c => swatch(c, h, true));
    for (const s of document.querySelectorAll('.sw')) s.classList.toggle('on', s.dataset.color === state.color);
    $('colorWell').style.background = state.color;
  }
  function pushColorHistory(c) {
    if (!isHex(c) || PRESETS.includes(c)) return;
    state.history = [c, ...state.history.filter(x => !near(x, c))].slice(0, 8);
    refreshSwatches();
  }

  // in-panel picker(ペンの色)
  const pickerEl = $('picker'), svEl = $('sv'), hueEl = $('hue'), hexEl = $('hex');
  const picker = { target: null, h: 0, s: 0, v: 0 };
  function openPicker(target) {
    if (picker.target === target) return closePicker();
    picker.target = target;
    pickerEl.classList.remove('closed');
    $('pickerTitle').textContent = target === 'ocolor' ? 'フチの色' : 'ペンの色';
    $('colorWell').classList.toggle('on', target === 'color');
    syncPicker(); positionPanel();
  }
  function closePicker() {
    picker.target = null;
    pickerEl.classList.add('closed');
    $('colorWell').classList.remove('on');
    positionPanel();
  }
  function syncPicker() {
    if (!picker.target) return;
    const c = state[picker.target];
    Object.assign(picker, hexToHsv(c));
    hexEl.value = c; hexEl.classList.remove('bad');
    drawPicker();
  }
  function drawPicker() {
    const sc = svEl.getContext('2d'), sw = svEl.width, sh = svEl.height;
    sc.fillStyle = hsvToHex(picker.h, 1, 1); sc.fillRect(0, 0, sw, sh);
    let g = sc.createLinearGradient(0, 0, sw, 0);
    g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
    sc.fillStyle = g; sc.fillRect(0, 0, sw, sh);
    g = sc.createLinearGradient(0, 0, 0, sh);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000');
    sc.fillStyle = g; sc.fillRect(0, 0, sw, sh);
    const x = picker.s * sw, y = (1 - picker.v) * sh;
    sc.lineWidth = 2; sc.strokeStyle = picker.v > 0.5 ? '#000' : '#fff';
    sc.beginPath(); sc.arc(x, y, 5, 0, Math.PI * 2); sc.stroke();

    const hc = hueEl.getContext('2d'), hw = hueEl.width, hh = hueEl.height;
    g = hc.createLinearGradient(0, 0, hw, 0);
    for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, hsvToHex(i * 60 % 360, 1, 1));
    hc.fillStyle = g; hc.fillRect(0, 0, hw, hh);

  // ---------- 画面に出る小パレット(右クリック / 長押し)----------
  const qp = $('qp');

        modes.appendChild(b);

    }

    dp.addEventListener('click', () => { closeQuickPalette(); startDropper(); });
    sw.appendChild(dp);
    qp.append(tools, modes, sw);

    const w = qp.offsetWidth, h = qp.offsetHeight;

  // 小パレットの外を触ったら閉じる(その操作では描かない)
  document.addEventListener('pointerdown', e => {

    if (e.target === view) e.stopPropagation();
  }, true);
  $('pickerClose').addEventListener('click', closePicker);

  const layersEl = $('layers');
  function refreshLayers() {
    layersEl.innerHTML = '';
    for (let i = 0; i < LAYER_COUNT; i++) {
      const d = document.createElement('div');
      d.className = 'layer' + (i === state.active ? ' on' : '') + (state.visible[i] ? ' visible' : '');
      const eye = document.createElement('span'); eye.className = 'eye'; eye.title = '表示/非表示';
      eye.addEventListener('click', ev => { ev.stopPropagation(); state.visible[i] = !state.visible[i]; refreshLayers(); render(); save(); });
      const name = document.createElement('span'); name.textContent = i + 1;

  $('redo').addEventListener('click', () => board.collab ? board.collab.redo() : redo());

  }

  $('clearAll').addEventListener('click', () => board.collab ? board.collab.clear('all') : clearLayers('all'));
  $('hideUi').addEventListener('click', () => setUiHidden(true));

  function setUiHidden(h) {

    ui.classList.toggle('hidden', h);
    save();
  }
  function setPanelOpen(o) {
    state.panelOpen = o;
    panel.classList.toggle('closed', !o);
    fab.classList.toggle('open', o);
    positionPanel(); save();
  }

  // floating button: drag or click
  let drag = null;

    fab.setPointerCapture(e.pointerId);

    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top, moved: false, sx: e.clientX, sy: e.clientY };

  });
  fab.addEventListener('pointerup', e => {
    if (!drag) return;
    if (!drag.moved) setPanelOpen(!state.panelOpen); else save();
    drag = null;
  });
  function placeFab(x, y) {
    x = Math.max(4, Math.min(VW - 50, x)); y = Math.max(4, Math.min(VH - 50, y));
    state.fab = { x, y };
    fab.style.left = x + 'px'; fab.style.top = y + 'px';
    positionPanel();
  }
  function positionPanel() {
    if (!state.fab) return;
    const pw = 250, ph = panel.offsetHeight || 330;
    let x = state.fab.x + 54, y = state.fab.y;
    if (x + pw > VW - 4) x = state.fab.x - pw - 8;
    if (y + ph > VH - 4) y = Math.max(4, VH - ph - 4);

  // ---------- hotkeys ----------
  // Tab(UI 表示切替)だけ。1 文字キーは OBS の対話中に誤爆しやすいので割り当てない。
  // Ctrl+Z も付けない: OBS の対話では OBS 本体の「元に戻す」に吸われ、シーン編集まで戻ってしまう(2026-10-15 ぽこ確認)

    if (e.key === 'Tab') { e.preventDefault(); setUiHidden(!state.uiHidden); }
    if (e.key === 'Escape') { closeQuickPalette(); if (picking) setPicking(false); }
  });

  // ---------- persistence ----------
  // 保存: 設定 + レイヤーの画像(1.1 までの版でも開ける形)+ 線の記録(1.2.0 から)。
  // 線の記録 = base(戻せない部分の画像)+ ops(直近 100 個)。読み込むと base + ops で描き直すので、
  // 再読み込みしても直近 100 本は線ごと消せる。容量が足りないときは画像だけで保存し直す
  let saveTimer = 0;
  const baseUrl = Array(LAYER_COUNT).fill(null); // 保存用の base 画像(焼き込みが起きた時だけ作り直す)
  const r1s = v => Math.round(v * 10) / 10;
  function packOp(op) {

    if (op.kind === 'stroke') Object.assign(o, { tool: op.tool, color: op.color, alpha: op.alpha, size: op.size, ec: op.ec, osize: op.osize,
      pts: op.pts.flatMap(p => [r1s(p.x), r1s(p.y)]) });
    if (op.kind === 'erase') o.targets = op.targets.slice();
    return o;
  }
  function unpackOp(o) {
    if (!o || typeof o !== 'object' || !Number.isInteger(o.id)) return null;
    const lay = v => Number.isInteger(v) && v >= 0 && v < LAYER_COUNT;
    if (o.kind === 'clear') return lay(o.layer) || o.layer === 'all' ? { kind: 'clear', id: o.id, layer: o.layer } : null;
    if (o.kind === 'erase') return lay(o.layer) && Array.isArray(o.targets) ? { kind: 'erase', id: o.id, layer: o.layer, targets: o.targets.filter(Number.isInteger) } : null;
    if (o.kind !== 'stroke' || !lay(o.layer) || !(TOOL_IDS.includes(o.tool) || o.tool === 'outline') || !isHex(o.color)) return null;
    if (!Array.isArray(o.pts) || o.pts.length < 2 || o.pts.length % 2) return null;
    const pts = [];
    for (let k = 0; k < o.pts.length; k += 2) pts.push({ x: +o.pts[k] || 0, y: +o.pts[k + 1] || 0 });

    return { kind: 'stroke', id: o.id, layer: o.layer, tool: o.tool, color: o.color, alpha: num(o.alpha, 1), size: num(o.size, 8),

  }
  function readSaved() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (_) { return null; }
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const settings = {
        tool: state.tool, size: state.size, alpha: state.alpha, malpha: state.malpha, color: state.color,
        oedge: state.oedge, ocolor: state.ocolor, eo: state.eo, emode: state.emode, active: state.active,
        visible: state.visible, history: state.history, fab: state.fab,
        uiHidden: state.uiHidden, panelOpen: state.panelOpen,
      };
      // 一緒にデコる中の絵は保存しない(1 人で描いていた絵と線の記録をそのまま残す)
      if (board.collab) {
        try { localStorage.setItem(LS_KEY, JSON.stringify({ ...(readSaved() || {}), settings })); } catch (err) { console.warn('save failed', err); }
        return;
      }
      const imgs = layers.map(c => ({ img: c.toDataURL() }));
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({ settings, layers: imgs,
          base: base.map((c, i) => baseUrl[i] || (baseUrl[i] = c.toDataURL())), ops: ops.map(packOp), nextId }));
      } catch (err) {
        console.warn('save failed (線の記録なしで保存し直します)', err);
        try { localStorage.setItem(LS_KEY, JSON.stringify({ settings, layers: imgs })); } catch (err2) { console.warn('save failed', err2); }
      }
    }, 300);
  }
  const TOOL_IDS = ['brush', 'gloss', 'marker', 'neon', 'watercolor', 'eraser'];
  // フチ幅(道具ごと)。1.0.x の保存は osize 1 つで、縁取りを選んでいた時だけそのフチ幅をペンに引き継ぐ
  // (ほかの道具は 0 = フチなし。引き継ぐと今までのペンにいきなりフチが付く)
  function loadEdgeSizes(s) {
    const n = v => typeof v === 'number' && v >= 0 && v <= 30 ? Math.round(v) : 0;
    if (s.eo && typeof s.eo === 'object') return { brush: n(s.eo.brush), gloss: n(s.eo.gloss), marker: n(s.eo.marker), watercolor: 0 };
    return { brush: s.tool === 'outline' ? n(s.osize || 4) : 0, gloss: 0, marker: 0, watercolor: 0 };
  }
  function load() {
    let data = null;

        malpha: typeof s.malpha === 'number' && s.malpha >= 0.05 && s.malpha <= 1 ? s.malpha : MARKER_ALPHA,

        oedge: ['auto', 'white', 'black', 'custom'].includes(s.oedge) ? s.oedge : 'auto',
        ocolor: isHex(s.ocolor) ? s.ocolor : '#ffffff',
        eo: loadEdgeSizes(s),
        active: s.active || 0, visible: s.visible || [true, true, true],
        history: Array.isArray(s.history) ? s.history.filter(isHex).slice(0, 8) : [], fab: s.fab || null,
        uiHidden: !!s.uiHidden, panelOpen: !!s.panelOpen,
        emode: s.emode === 'object' ? 'object' : 'pixel',
      });
    }
    const promises = [];
    // 1.2.0 からの保存: base の画像 + 線の記録で描き直す(線ごと消せる)
    const withOps = !!(data && Array.isArray(data.ops) && Array.isArray(data.base));
    if (withOps) {
      data.base.forEach((u, i) => { if (i < LAYER_COUNT && typeof u === 'string') promises.push(loadInto(base[i], u)); });
      return Promise.all(promises).then(() => {
        ops = data.ops.map(unpackOp).filter(Boolean).slice(-OPS_MAX);
        nextId = Math.max(Number.isInteger(data.nextId) ? data.nextId : 1, ...ops.map(op => op.id + 1));
        for (let i = 0; i < LAYER_COUNT; i++) { baseUrl[i] = typeof data.base[i] === 'string' ? data.base[i] : null; rebuild(i); }
      });
    }
    if (data && data.layers) {
      data.layers.forEach((L, i) => {
        if (i >= LAYER_COUNT) return;
        if (L.img) { promises.push(loadInto(layers[i], L.img)); return; }
        // 0.1.0 の保存形式(フチと線が別)は、フチ → 線の順に 1 枚へまとめる
        promises.push(loadInto(layers[i], L.outline).then(() => loadInto(layers[i], L.ink, true)));
      });
    }
    // 読み込んだ絵は base にも写す(読み込み前の操作は戻せない)
    return Promise.all(promises).then(() => {
      for (let i = 0; i < LAYER_COUNT; i++) {
        const c = base[i].getContext('2d');
        c.clearRect(0, 0, W, H); c.drawImage(layers[i], 0, 0);
      }
    });
  }

  function applySettingsToUi() {
    $('size').value = state.size; $('sizeVal').textContent = state.size;
    $('alpha').value = Math.round(state.alpha * 100); $('alphaVal').textContent = Math.round(state.alpha * 100);
    setTool(state.tool); setEdge(state.oedge); setEmode(state.emode);
    refreshSwatches(); refreshLayers(); updateButtons();
    ui.classList.toggle('hidden', state.uiHidden);
    placeFab(state.fab ? state.fab.x : VW - 70, state.fab ? state.fab.y : VH - 70);
    setPanelOpen(state.panelOpen);
  }

  // ---------- 一緒にデコる(collab.js。今はプラス版の Web 版だけ)から使う口。1 人で描くときは board.collab が null ----------
  const board = {
    collab: null, // 一緒にデコる中は collab.js のオブジェクト(begin / points / end / clear / undo / redo / renderLayer / canDraw / maxPoints
                  //   / erasable(線ごと消せる自分の線)/ previewErase(なぞっている途中の線を隠す)/ erase(線ごと消すを送る))
    LAYER_COUNT, state, layers, panel,
    get W() { return W; }, get H() { return H; }, get stroke() { return stroke; },
    applyOp, paintStrokeTo, drawPath, render, makeCanvas, updateButtons, save,
    // 論理座標のステージに切り替える / 戻す。切り替えるとレイヤーは空になる
    setStage(st) {
      stage = st; resize(true);
      for (let i = 0; i < LAYER_COUNT; i++) {
        layers[i].getContext('2d').clearRect(0, 0, W, H);
        base[i].getContext('2d').clearRect(0, 0, W, H);
        L[i].grp = []; B[i].grp = []; baseUrl[i] = null;
      }
      ops = []; redoOps = []; updateButtons(); render();
    },
    // レイヤー i を空から list(seq 順の op)で描き直す / 末尾に足す。縁取りのまとめ方は 1 人のときと同じ
    relayer(i, list) { layers[i].getContext('2d').clearRect(0, 0, W, H); L[i].grp = []; appendOps(layers[i], L[i], list); },
    appendLayer(i, list) { appendOps(layers[i], L[i], list); },
  };
  window.decoBoard = board;

  // ---------- init ----------
  if (typeof window.obsstudio === 'undefined' && new URLSearchParams(location.search).get('bg') !== 'transparent') document.body.classList.add('preview');
  $('ver').textContent = VERSION;
  window.addEventListener('resize', () => { resize(); if (state.fab) placeFab(state.fab.x, state.fab.y); });
  resize();
  load().then(() => { applySettingsToUi(); render(); });
})();
</script>
</body>
