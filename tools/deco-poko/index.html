<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デコポコ</title>
<style>
  :root {
    --panel: rgba(28, 22, 34, 0.92);
    --panel-edge: rgba(255, 255, 255, 0.08);
    --ink: #f3eef7;
    --ink-dim: #a99bb5;
    --accent: #ff7fb3;
    --accent-soft: rgba(255, 127, 179, 0.18);
    --radius: 14px;
    --font: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    font-family: var(--font);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #view {
    position: fixed; inset: 0; display: block;
    cursor: none;
  }
  #cursor {
    position: fixed; left: 0; top: 0; width: 20px; height: 20px;
    border: 1.5px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.6);
    pointer-events: none; transform: translate(-50%, -50%);
    display: none;
  }
  #ui.hidden { display: none; }
  /* OBS の外で開いた時だけ、透過部分が分かるように市松模様を出す(?bg=transparent で消せる) */
  body.preview { background: repeating-conic-gradient(#8a8a8a 0 25%, #a8a8a8 0 50%) 0 0 / 24px 24px; }

  /* floating button */
  #fab {
    position: fixed; width: 46px; height: 46px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--panel-edge);
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    display: grid; place-items: center; cursor: grab; z-index: 10;
    color: var(--ink);
  }
  #fab:active { cursor: grabbing; }
  #fab .dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff;
    transition: transform .15s;
  }
  #fab.open .dot { transform: scale(.6); }

  /* panel */
  #panel {
    position: fixed; width: 250px; padding: 12px; z-index: 9;
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: var(--radius); color: var(--ink);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    backdrop-filter: blur(8px);
    font-size: 12px; line-height: 1.4;
    max-height: calc(100vh - 8px); overflow-y: auto; /* 小さいウィンドウでも下の欄まで届くように */
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent;
  }
  #panel.closed { display: none; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .row label { color: var(--ink-dim); min-width: 46px; }
  .seg { display: flex; gap: 4px; flex: 1; }
  .seg button, .btn {
    flex: 1; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--panel-edge);
    background: rgba(255,255,255,.04); color: var(--ink); font: inherit; cursor: pointer;
  }
  .seg button.on { background: var(--accent-soft); border-color: var(--accent); }
  #tools { flex-wrap: wrap; }
  #tools button { flex: 1 0 28%; }
  .edot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 3px; vertical-align: middle;
    box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
  /* 画面に出る小パレット(右クリック / 長押し) */
  #qp { position: fixed; z-index: 30; width: 252px; padding: 8px; border-radius: 12px; background: var(--panel);
    border: 1px solid var(--panel-edge); box-shadow: 0 8px 24px rgba(0,0,0,.45); color: var(--ink); font-size: 12px; }
  #qp .qtools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-bottom: 6px; }
  #qp .qtools button { padding: 5px 0; white-space: nowrap; letter-spacing: -.02em; border-radius: 7px; border: 1px solid var(--panel-edge); background: rgba(255,255,255,.04);
    color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; }
  #qp .qtools button.on { background: var(--accent-soft); border-color: var(--accent); }
  #qp .qsw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  #qp .qsw div { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); cursor: pointer; }
  #qp .qsw div.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* フチを付けられない道具(ネオン・水彩・消しゴム)を選んでいる間はフチの欄を薄くする */
  #panel.noedge .edgeRow { opacity: .35; pointer-events: none; }
  .btn:hover, .seg button:hover { background: rgba(255,255,255,.1); }
  .btn:disabled { opacity: .35; cursor: default; }
  input[type=range] { flex: 1; accent-color: var(--accent); margin: 0; }
  .val { width: 30px; text-align: right; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .well {
    width: 30px; height: 26px; padding: 0; border: 1px solid var(--panel-edge);
    border-radius: 6px; cursor: pointer; flex: none;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.25);
  }
  .well.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* in-panel color picker (native <input type=color> の popup は OBS の対話ウィンドウで当てにならない) */
  #picker { margin: 0 0 8px; padding: 8px; border-radius: 10px; background: rgba(0,0,0,.25); }
  #picker.closed { display: none; }
  #picker .title { color: var(--ink-dim); margin-bottom: 6px; }
  #sv, #hue { display: block; width: 100%; border-radius: 6px; cursor: crosshair; touch-action: none; }
  #sv { height: 110px; margin-bottom: 6px; }
  #hue { height: 14px; margin-bottom: 8px; }
  #hex {
    flex: 1; min-width: 0; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--panel-edge);
    background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums;
    user-select: text; -webkit-user-select: text;
  }
  #hex.bad { border-color: #ff4d4d; }
  .swatches { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .sw {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5);
    cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.4);
  }
  .sw.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layers { display: flex; gap: 4px; flex: 1; }
  .layer {
    flex: 1; display: flex; align-items: center; gap: 4px; padding: 4px 6px;
    border-radius: 8px; border: 1px solid var(--panel-edge); cursor: pointer;
    background: rgba(255,255,255,.04);
  }
  .layer.on { background: var(--accent-soft); border-color: var(--accent); }
  .layer .eye {
    width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink-dim);
    flex: none;
  }
  .layer.visible .eye { background: var(--ink); border-color: var(--ink); }
  .hint { color: var(--ink-dim); font-size: 10px; text-align: center; margin-top: 4px; }
  .sep { height: 1px; background: var(--panel-edge); margin: 10px -12px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="cursor"></div>

<div id="qp" hidden></div>
<div id="ui">
  <div id="fab" title="ドラッグで移動 / クリックで開閉"><div class="dot"></div></div>
  <div id="panel" class="closed">
    <div class="row">
      <label>ツール</label>
      <div class="seg" id="tools">
        <button data-tool="brush" title="ふつうの線。フチ幅を上げるとフチが付く">ペン</button>
        <button data-tool="gloss" title="ツヤのある線。フチ幅を上げるとフチが付く">艶</button>
        <button data-tool="marker" title="半透明。続けて描いても重なりが濃くならない。フチ幅を上げるとフチが付く">マーカー</button>
        <button data-tool="neon" title="線の色で光るペン">ネオン</button>
        <button data-tool="watercolor" title="にじんだ水彩。重ねると濃くなる">水彩</button>
        <button data-tool="eraser">消しゴム</button>
      </div>
    </div>
    <div class="row">
      <label>太さ</label>
      <input type="range" id="size" min="1" max="80" value="8">
      <span class="val" id="sizeVal">8</span>
    </div>
    <div class="row">
      <label>不透明</label>
      <input type="range" id="alpha" min="5" max="100" value="100">
      <span class="val" id="alphaVal">100</span>
    </div>
    <div class="row">
      <label>色</label>
      <button class="well" id="colorWell" title="ペンの色を選ぶ"></button>
      <div class="swatches" id="presets"></div>
    </div>
    <div class="row">
      <label>履歴</label>
      <div class="swatches" id="history" title="描いた色が入ります / 右クリックで削除"></div>
    </div>
    <div class="row edgeRow">
      <label>フチ色</label>
      <div class="seg" id="oedge" title="フチの色。自動はペンが明るいと黒、暗いと白">
        <button data-edge="auto">自動</button>
        <button data-edge="white">白</button>
        <button data-edge="black">黒</button>
        <button data-edge="custom" title="フチの色を自由に選ぶ">自由<span class="edot" id="ocolorDot"></span></button>
      </div>
    </div>
    <div class="row edgeRow">
      <label>フチ幅</label>
      <input type="range" id="osize" min="0" max="30" value="0" title="フチの太さ。0 はフチなし(ペン・艶・マーカーごとに覚える)">
      <span class="val" id="osizeVal">0</span>
    </div>
    <div id="picker" class="closed">
      <div class="title" id="pickerTitle">ペンの色</div>
      <canvas id="sv" width="226" height="110"></canvas>
      <canvas id="hue" width="226" height="14"></canvas>
      <div class="row">
        <input id="hex" maxlength="7" spellcheck="false" autocomplete="off">
        <button class="btn" id="pickerClose" style="flex:none;padding:6px 10px">閉じる</button>
      </div>
    </div>
    <div class="sep"></div>
    <div class="row">
      <label>レイヤー</label>
      <div class="layers" id="layers"></div>
    </div>
    <div class="row">
      <button class="btn" id="undo">戻す</button>
      <button class="btn" id="redo">やり直す</button>
      <button class="btn" id="clearLayer">このレイヤーを消す</button>
    </div>
    <div class="row">
      <button class="btn" id="clearAll">全部消す</button>
      <button class="btn" id="hideUi">UIを隠す (Tab)</button>
    </div>
    <div class="hint">Tab でUIを隠す/出す ・ 履歴は右クリックで削除 ・ v<span id="ver"></span></div>
  </div>
</div>

<script>
(() => {
  const VERSION = '1.1.1'; // tools/deco-poko/tool.json と揃える
  // OBS のローカルファイル指定は全ソースが同じ origin(localStorage 共有)になるので、
  // 複数置くときは ?id=xxx を付けて保存先を分ける
  const BOARD_ID = new URLSearchParams(location.search).get('id') || '';
  // 一緒にデコるの OBS 用 / 招待 URL の画面は、ブラウザ版(1 人で描く絵)と保存を分ける(同じブラウザで開いても絵を上書きしない)
  const PLUS_VIA = (location.pathname.match(/^\/tools\/plus\/(obs|guest)\//) || [])[1];
  const LS_KEY = 'poko-deco-poko-v1' + (PLUS_VIA ? ':' + PLUS_VIA : '') + (BOARD_ID ? ':' + BOARD_ID : '');
  const LAYER_COUNT = 3;
  const OPS_MAX = 100; // 戻せる回数。超えた古い操作は base に焼き込む
  const PRESETS = ['#ffffff', '#000000', '#ff7fb3', '#ff4d4d', '#ffcc33', '#5ad66b', '#4aa3ff', '#b57bff'];

  const view = document.getElementById('view');
  const vctx = view.getContext('2d');
  const cursorEl = document.getElementById('cursor');
  const ui = document.getElementById('ui');
  const fab = document.getElementById('fab');
  const panel = document.getElementById('panel');

  let W = 0, H = 0;   // 絵の大きさ(1 人のときはウィンドウ、一緒にデコる中は 1920x1080 の論理座標)
  let VW = 0, VH = 0; // ウィンドウ(表示)の大きさ
  let stage = null;   // 一緒にデコる中だけ {w: 1920, h: 1080}。collab.js が setStage で切り替える
  let vs = 1, vox = 0, voy = 0; // 絵 → 表示の拡大率とずらし

  // ---------- state ----------
  const state = {
    tool: 'brush',
    size: 8,
    alpha: 1,
    malpha: 0.4, // マーカーの濃さ(マーカーを選んでいる間の「不透明」スライダー)
    color: '#ff7fb3',
    oedge: 'auto', // 'auto' | 'white' | 'black' | 'custom'
    ocolor: '#ffffff', // oedge が custom のときのフチ色
    eo: { brush: 0, gloss: 0, marker: 0 }, // フチ幅(道具ごと)。0 はフチなし
    active: 0,
    visible: [true, true, true],
    history: [],
    fab: null,
    uiHidden: false,
    panelOpen: false,
  };

  // 1 レイヤー = canvas 1 枚。縁取りは線 1 本ごとに「フチ+線」をまとめて上に重ねる
  // (フチだけ別の canvas に分けると、あとから描いた縁取りのフチが先に描いた線の下に回る)
  const layers = [];
  const makeCanvas = () => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, W); c.height = Math.max(1, H);
    return c;
  };
  // base = 戻せなくなった古い操作(と読み込んだ保存画像)を焼き込んだ画像。レイヤー = base + ops
  const base = [];
  for (let i = 0; i < LAYER_COUNT; i++) { layers.push(null); base.push(null); }
  // 縁取りが続く間はフチをまとめる(普通のペン・消しゴム・消去で区切る)。そのためにレイヤーごとに
  //   grp   = 今続いている縁取りの op(この間はフチを全部下に、線を全部上に描く)
  //   below = その縁取りが始まる前の画像(grp があるときだけ使う)
  // を持つ。L = 表示しているレイヤー、B = base(戻せない部分)。base をまたいで続く縁取りもつながる
  // kind = まとまりの種類(outline: フチをまとめる / marker: 重ねても濃くならない)
  const L = [], B = [];
  for (let i = 0; i < LAYER_COUNT; i++) { L.push({ grp: [], below: null, kind: null }); B.push({ grp: [], below: null, kind: null }); }

  let temp = null;    // 描いている途中の線(確定時にそのままレイヤーへ重ねる)
  let scratch = null; // 描き直しで線 1 本を組み立てる作業用
  let mk = null;      // マーカーのまとまりを不透明で描いてから 40% で重ねる作業用
  let gk = null, wk = null; // 艶・水彩・フチ付きマーカーを 1 本ずつ組み立てる作業用

  function resize(force) {
    VW = window.innerWidth; VH = window.innerHeight;
    if (view.width !== VW || view.height !== VH) { view.width = VW; view.height = VH; }
    const nw = stage ? stage.w : VW, nh = stage ? stage.h : VH;
    vs = stage ? Math.min(VW / nw, VH / nh) : 1;
    vox = stage ? (VW - nw * vs) / 2 : 0; voy = stage ? (VH - nh * vs) / 2 : 0;
    updateCursorSize();
    if (!force && nw === W && nh === H) { render(); return; }
    const ow = W, oh = H;
    W = nw; H = nh;
    const grow = (old) => {
      const c = makeCanvas();
      if (old && ow && oh) c.getContext('2d').drawImage(old, 0, 0);
      return c;
    };
    for (let i = 0; i < LAYER_COUNT; i++) {
      layers[i] = grow(layers[i]); base[i] = grow(base[i]);
      L[i].below = grow(L[i].below); B[i].below = grow(B[i].below);
    }
    temp = grow(null); scratch = grow(null); mk = grow(null); gk = grow(null); wk = grow(null);
    render();
  }

  // ---------- rendering ----------
  let raf = 0;
  function render() {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      vctx.setTransform(1, 0, 0, 1, 0, 0);
      vctx.clearRect(0, 0, VW, VH);
      vctx.setTransform(vs, 0, 0, vs, vox, voy);
      for (let i = 0; i < LAYER_COUNT; i++) {
        if (!state.visible[i]) continue;
        // 縁取りを続けて描いている途中は、まとまり全体を temp に描き直しているので、始まる前の画像の上に重ねる
        const cont = stroke && i === stroke.layer && groupKind(stroke) && L[i].grp.length && L[i].kind === groupKind(stroke);
        vctx.drawImage(cont ? L[i].below : layers[i], 0, 0);
        if (board.collab) board.collab.renderLayer(vctx, i); // 確定待ちの自分の線・相手の描きかけ
        if (stroke && i === stroke.layer && stroke.tool !== 'eraser') vctx.drawImage(temp, 0, 0);
      }
    });
  }

  // ---------- 操作ログ(戻す / やり直す) ----------
  // op = 線   {kind: 'stroke', layer, tool, color, alpha, size, ec(フチ色。確定時に決める), osize(フチ幅。0 はフチなし), pts: [{x, y}]}
  //    | 消去 {kind: 'clear', layer: 0..2 | 'all'}
  // レイヤーの画像 = base + そのレイヤーに関わる op を順に重ねたもの。戻すは最後の op を外して描き直す
  let ops = [], redoOps = [];
  const affects = (op, i) => op.layer === 'all' || op.layer === i;
  const opLayers = op => op.layer === 'all' ? [...Array(LAYER_COUNT).keys()] : [op.layer];

  // 線 1 本を ctx に重ねる。縁取りは scratch で「フチ+線」を組み立ててから重ねる(描いている途中の表示と同じ)
  function applyOp(ctx, op) {
    if (op.kind === 'break') return; // 縁取りのまとまりを区切るだけの印(一緒にデコるの「自分の線だけ消す」など)
    if (op.kind === 'clear') { ctx.clearRect(0, 0, W, H); return; }
    if (op.tool === 'eraser') { drawPath(ctx, op.pts, op.size, '#000', 1, 'destination-out'); return; }
    const r = strokeRadius(op);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of op.pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
    x0 = Math.max(0, Math.floor(x0 - r)); y0 = Math.max(0, Math.floor(y0 - r));
    const w = Math.min(W, Math.ceil(x1 + r)) - x0, h = Math.min(H, Math.ceil(y1 + r)) - y0;
    if (w <= 0 || h <= 0) return;
    const c = scratch.getContext('2d');
    c.clearRect(x0, y0, w, h);
    paintStrokeTo(c, op);
    ctx.drawImage(scratch, x0, y0, w, h, x0, y0, w, h);
  }
  // 線の種類: brush / gloss(艶)/ marker(半透明、重ねても濃くならない)/ neon(光る)/ watercolor(水彩)/ eraser
  //   brush・gloss・marker は osize > 0 でフチが付く(1.1.0 で「縁取り」ペンをこれに統合。2026-10-24 ぽこ)。
  //   outline は 1.0.x までの縁取り(= フチ付きの brush)。古い版の相手から届いたときのために描ける形で残す
  const EDGE_TOOLS = ['brush', 'gloss', 'marker'];
  const hasEdge = op => op.tool === 'outline' || (EDGE_TOOLS.includes(op.tool) && op.osize > 0);
  const wcBlur = op => Math.max(1, op.size * 0.08);
  const MARKER_ALPHA = 0.4; // マーカーの濃さの初期値(スライダーで変えられる)
  const neonBlur = op => op.size * 1.5 + 6;
  // まとまりになる線の種類。縁取りはフチをまとめ、ネオンは光をまとめ、マーカーは重なりを濃くしない。それ以外の線と消去で区切る。
  // マーカーは濃さが同じものだけをまとめる(濃さを変えたら別のまとまり)ので、種類に濃さを含める
  const groupKind = op => {
    if (!op || op.kind === 'clear' || op.kind === 'break') return null;
    if (op.tool === 'neon') return 'neon';
    if (op.tool === 'marker') return 'marker@' + Math.round((op.alpha ?? MARKER_ALPHA) * 100);
    // 艶はフチの有無にかかわらず続く間まとめる(線を全部 → 影を全部 → ツヤを全部。重なりがフチ付きのペンと同じく 1 本になじむ)
    if (op.tool === 'gloss') return 'gloss@' + Math.round((op.alpha ?? 1) * 100);
    if (hasEdge(op)) return 'outline'; // フチ付きのペンは、続く間フチをまとめる
    return null;
  };
  const isMarkerKind = k => typeof k === 'string' && k.startsWith('marker');
  function strokeRadius(op) {
    if (op.tool === 'neon') return op.size / 2 + neonBlur(op) * 1.5 + 2;
    if (op.tool === 'watercolor') return op.size / 2 + wcBlur(op) * 3 + 2;
    if (hasEdge(op)) return (op.size + op.osize * 2) / 2 + 2;
    return op.size / 2 + 2;
  }
  function mixWhite(hex, t) { return mixTo(hex, 255, t); }
  function mixTo(hex, to, t) {
    if (!/^#[0-9a-fA-F]{6}$/.test(hex || '')) return '#ffffff';
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    const m = v => Math.round(v + (to - v) * t).toString(16).padStart(2, '0');
    return '#' + m(r) + m(g) + m(b);
  }

  function setOcolor(c) {

  function swatch(color, parent, removable) {

  }
  function refreshSwatches() {

    state.history.forEach(c => swatch(c, h, true));

  }
  function pushColorHistory(c) {

  // in-panel picker(ペンの色)
  const pickerEl = $('picker'), svEl = $('sv'), hueEl = $('hue'), hexEl = $('hex');
  const picker = { target: null, h: 0, s: 0, v: 0 };
  function openPicker(target) {
    if (picker.target === target) return closePicker();
    picker.target = target;
    pickerEl.classList.remove('closed');

  }
  function closePicker() {
    picker.target = null;

  }
  function syncPicker() {
    if (!picker.target) return;
    const c = state[picker.target];

    hexEl.value = c; hexEl.classList.remove('bad');
    drawPicker();
  }
  function drawPicker() {
    const sc = svEl.getContext('2d'), sw = svEl.width, sh = svEl.height;
    sc.fillStyle = hsvToHex(picker.h, 1, 1); sc.fillRect(0, 0, sw, sh);
    let g = sc.createLinearGradient(0, 0, sw, 0);
    g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
    sc.fillStyle = g; sc.fillRect(0, 0, sw, sh);
    g = sc.createLinearGradient(0, 0, 0, sh);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000');

  const clamp01 = v => Math.max(0, Math.min(1, v));

  // ---------- persistence ----------
  let saveTimer = 0;
  function save() {

  function soloLayers() {

  }
  const TOOL_IDS = ['brush', 'gloss', 'marker', 'neon', 'watercolor', 'eraser'];
  // フチ幅(道具ごと)。1.0.x の保存は osize 1 つで、縁取りを選んでいた時だけそのフチ幅をペンに引き継ぐ
  // (ほかの道具は 0 = フチなし。引き継ぐと今までのペンにいきなりフチが付く)
  function loadEdgeSizes(s) {
    const n = v => typeof v === 'number' && v >= 0 && v <= 30 ? Math.round(v) : 0;
    if (s.eo && typeof s.eo === 'object') return { brush: n(s.eo.brush), gloss: n(s.eo.gloss), marker: n(s.eo.marker) };
    return { brush: s.tool === 'outline' ? n(s.osize || 4) : 0, gloss: 0, marker: 0 };
  }
  function load() {
    let data = null;

    if (data && data.settings) {
      const s = data.settings;
      Object.assign(state, {
        tool: TOOL_IDS.includes(s.tool) ? s.tool : 'brush', size: s.size || 8, alpha: s.alpha ?? 1, // 1.0.x の縁取りはフチ付きのペンに
        malpha: typeof s.malpha === 'number' && s.malpha >= 0.05 && s.malpha <= 1 ? s.malpha : MARKER_ALPHA,
        color: isHex(s.color) ? s.color : state.color,
        oedge: ['auto', 'white', 'black', 'custom'].includes(s.oedge) ? s.oedge : 'auto',
        ocolor: isHex(s.ocolor) ? s.ocolor : '#ffffff',
        eo: loadEdgeSizes(s),
        active: s.active || 0, visible: s.visible || [true, true, true],
        history: Array.isArray(s.history) ? s.history.filter(isHex).slice(0, 8) : [], fab: s.fab || null,

    return Promise.all(promises).then(() => {

    });
  }

  function applySettingsToUi() {

  // ---------- 一緒にデコる(collab.js。今はプラス版の Web 版だけ)から使う口。1 人で描くときは board.collab が null ----------
  const board = {
    collab: null, // 一緒にデコる中は collab.js のオブジェクト(begin / points / end / clear / undo / redo / renderLayer / canDraw / maxPoints)
    LAYER_COUNT, state, layers, panel,
    get W() { return W; }, get H() { return H; }, get stroke() { return stroke; },
    applyOp, paintStrokeTo, drawPath, render, makeCanvas, updateButtons, save,
    // 論理座標のステージに切り替える / 戻す。切り替えるとレイヤーは空になる
    setStage(st) {
      stage = st; resize(true);
      for (let i = 0; i < LAYER_COUNT; i++) {
        layers[i].getContext('2d').clearRect(0, 0, W, H);
        base[i].getContext('2d').clearRect(0, 0, W, H);
        L[i].grp = []; B[i].grp = [];
      }
      ops = []; redoOps = []; updateButtons(); render();
    },
    // レイヤー i を空から list(seq 順の op)で描き直す / 末尾に足す。縁取りのまとめ方は 1 人のときと同じ
    relayer(i, list) { layers[i].getContext('2d').clearRect(0, 0, W, H); L[i].grp = []; appendOps(layers[i], L[i], list); },
    appendLayer(i, list) { appendOps(layers[i], L[i], list); },
  };
  window.decoBoard = board;

  // ---------- init ----------
  if (typeof window.obsstudio === 'undefined' && new URLSearchParams(location.search).get('bg') !== 'transparent') document.body.classList.add('preview');
  $('ver').textContent = VERSION;
  window.addEventListener('resize', () => { resize(); if (state.fab) placeFab(state.fab.x, state.fab.y); });
  resize();
  load().then(() => { applySettingsToUi(); render(); });
})();
</script>
