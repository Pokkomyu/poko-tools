test_cases:
  - test_case_id: TC-FNT-001
    title: '台帳: SHA256SUMS が shared/fonts の全ファイルと一致する'
    status: active
    source:
      requirement: design/02-fonts-review.md
      drbfm: docs/development/drbfm/20261105-shared-fonts-shared-font-store.md
      issue: shared-fonts
      code:
        - scripts/fonts.py
        - shared/fonts/manifest.json
    risk:
      failure_mode: '台帳: SHA256SUMS が shared/fonts の全ファイルと一致するが成り立たず、配布 zip でフォントが読めない、または外部依存・権利表記の欠落が混ざる'
      business_impact: 配信の表示崩れ・ライセンス違反の恐れ
    test_type: functional
    automation_level: semi_auto
    automation_type: script
    precondition:
      - feat/shared-fonts の作業ツリー
    steps:
      - 'python3 scripts/fonts.py check; (cd shared/fonts && sha256sum -c SHA256SUMS)'
    expected:
      - 'check OK、NG 0 件'
    evidence:
      required:
        - log
      path: docs/development/evidence/shared-fonts/test-results.md
    review:
      review_required: false
      review_reason: []
      blocking_release: false
    manual_reduction_plan: null
    skip_reason: null
    last_reviewed: null
    intent_ids: []
    supersedes: []
