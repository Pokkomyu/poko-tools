# test-case master: パークスロット(tools/dbd-perks)
#
# スキーマ: SQA schemas/test-case-master.schema.yaml / 生成方針: SQA docs/features/test-case-master.md
# 自動テストなし(file:// 前提)。semi_auto = ヘッドレス Chromium(playwright)で
# file:///<repo>/tools/dbd-perks/index.html を 1920x1080 で開き、スクショと computed style を取る。
# manual = OBS 実機や人の目。evidence は docs/development/evidence/<ticket>/ に <test_case_id>-*.png / .txt で残す。
#
# 共通の下ごしらえ(semi_auto):
#   - 状態は localStorage キー "poko-dbd-perks-v1" に JSON を入れてから開く(addInitScript)。
#     例: {"role":"k","layout":"row","bg":"transparent","showIcon":true,"showFrame":true,"showName":true,
#          "showChar":false,"sound":false,"k":{"slots":["K25P03","K38P02","No_One_Escapes_Death",null],"locked":[false,false,false,false],"excluded":[]}}
#   - 画像ありモード(.slots.icons)は app.js:201-208 が icons/ の 1 枚を読めたときだけ付く。
#     file:// の同じディレクトリなら Chromium は img を読める。.slots に icons クラスが付いたことを待ってから撮る。
#   - 回転は #spinBtn のクリック、または .slot のクリック(1 枠)。停止は SPIN_MS 1400ms + 枠ごとに 380ms(app.js:21-22)。
#   - ::before の computed style は page.evaluate(() => getComputedStyle(el, "::before")) で取る。

meta:
  repo: poko-tools
  feature: dbd-perks
  ticket_id: dbd-perks-official-perk-bg
  updated: 2026-11-03

test_cases:
  - test_case_id: TC-PKT-001
    title: '横並び・待機: 素材のひし形の対角線が slot(300px)に合い、回転なし・枠線なし・影なしで敷かれる'
    status: active
    source:
      requirement: docs/requirements/dbd-perks.md
      drbfm: docs/development/drbfm/20261103-dbd-perks-official-perk-bg-official-perk-background.md
      issue: dbd-perks-official-perk-bg
      code:
        - tools/dbd-perks/style.css
        - tools/dbd-perks/official/perk-bg.png
    risk:
      failure_mode: background-size / position / repeat の未指定や基底 .slot::before(left/top 14.6%・70.7%・border・box-shadow・rotate)の打ち消し漏れで、素材が縮む・ずれる・タイル状に並ぶ・四角い線が出る。素材のひし形は画像の 96%(bbox 6..252)なので 100% で敷くと今の枠より小さくなる
      business_impact: 配信画面の枠が崩れる
    test_type: ui
    automation_level: semi_auto
    automation_type: visual
    precondition:
      - '状態: role k / layout row / bg transparent / showIcon・showFrame・showName true / k.slots は 4 枠とも null(待機)'
      - 画像ありモード(.slots.icons)が付いている
    steps:
      - 1920x1080 でページを開き .slots.icons を待つ
      - 全画面スクショを撮る(TC-PKT-001-row-idle.png)
      - 4 つの .slot について ::before の computed style を取る(left, top, width, height, border-width, border-radius, box-shadow, transform, background-image, background-size, background-repeat, background-position)
    expected:
      - 4 枠とも紫のひし形+黒い石の縁が各 slot(300px 四方)の中央に 1 つずつ、先端が slot の 4 辺の中央(±3px)に来る(対角線 = 300px。今までの枠と同じ大きさ)。白いひし形・インク色の枠線・角丸・内側の色線は出ない
      - 'computed style: 素材の 96% が 300px になる大きさで中央に敷かれている(実装どおりなら left -6px / top -6px / width 312px / height 312px)/ border-width 0px / border-radius 0px / box-shadow none / transform none / background-image に official/perk-bg.png / background-size contain / background-repeat no-repeat / background-position 50% 50%'
      - 4 枠とも結果が同一
    evidence:
      required:
        - screenshot
        - log
      path: null
