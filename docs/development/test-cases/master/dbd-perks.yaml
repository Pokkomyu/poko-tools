  - test_case_id: TC-PKT-005
    title: 停止直後のポップが回転なし(scale だけ)で、終わりに角度・大きさがジャンプしない
    status: active
    source:
      drbfm: docs/development/drbfm/20261103-dbd-perks-official-perk-bg-official-perk-background.md
      issue: dbd-perks-official-perk-bg
      code:
        - tools/dbd-perks/style.css
        - tools/dbd-perks/app.js
    risk:
      failure_mode: 旧 keyframe slot-pop(style.css:89)の rotate(45deg) が画像ありにも当たり素材が 45° 回る。別 keyframe にしても最終フレーム(scale 1)と静止状態(transform none)が違い、終了時に飛ぶ。animation-name だけ変えて duration / easing が外れる
      business_impact: 止まった時の演出が崩れる
    test_type: ui
    automation_level: semi_auto
    automation_type: visual
    precondition:
      - '状態: role s / layout diamond / bg transparent / showIcon・showFrame・showName true / sound false / 4 枠とも null'
      - 画像ありモードが付いている
    steps:
      - '#spinBtn を押し、.slot[data-i="0"] に stopped が付くのを待つ'
      - すぐに el.getAnimations({subtree:true}) で ::before のアニメを pause し currentTime を 50%(225ms)にして、::before の computed transform と animation-name / animation-duration / animation-timing-function を取り、スクショ(TC-PKT-005-pop-mid.png)
      - アニメを再開し終了まで待ってから、::before の computed transform を取りスクショ(TC-PKT-005-pop-end.png)
    expected:
      - animation-name が slot-pop(rotate 前提)ではなく回転なしの keyframe。duration 0.45s、timing-function は cubic-bezier(.2, 1.6, .4, 1)のまま
      - 50% 時点の transform は matrix(a, 0, 0, a, 0, 0) の形(回転成分 0)。素材の先端が上下左右を向いたまま拡大縮小している
      - 終了後の transform は none または matrix(1, 0, 0, 1, 0, 0)。終了前後のスクショで素材の位置・大きさ・向きが同じ
    evidence:
      required:
        - screenshot
        - log
      path: null
